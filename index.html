<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meine Spiele</title>
<style>
  html, body {
    margin: 0;
    min-height: 100%;
    background: #111;
    color: #eee;
    font-family: "Courier New", monospace;
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 16px;
  }
  h1 {
    margin: 0 0 4px;
    color: #40ff40;
    letter-spacing: 4px;
  }
  .sub { margin: 0 0 32px; color: #888; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .card {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 20px;
    border: 2px solid #444;
    background: #000;
    color: inherit;
    text-decoration: none;
    transition: border-color 0.15s, transform 0.15s;
  }
  .card:hover, .card:focus-visible {
    border-color: var(--accent);
    transform: translateY(-3px);
    outline: none;
  }
  .num { color: #888; font-size: 14px; }
  .name { color: var(--accent); font-size: 24px; font-weight: bold; }
  .desc { color: #ccc; font-size: 14px; line-height: 1.4; flex: 1; }
  .score { color: #888; font-size: 14px; }
  .score b { color: #fff; }
  .card.todo {
    border-style: dashed;
    color: #555;
    pointer-events: none;
  }
  .card.todo .name { color: #555; }
  footer { margin-top: 32px; color: #666; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>MEINE SPIELE</h1>
  <p class="sub">Vom Ballwechsel bis zum DOOM-Klon · Lernpfad in ROADMAP.md</p>
  <div class="grid" id="games"></div>
  <footer>Tipp: Über einen lokalen Webserver (http://localhost:8000) öffnen, damit Bilder und Sounds laden.</footer>
</main>

<script>
// Die Spiele als Daten: Ein neues Spiel ist nur ein neuer Eintrag.
// highscoreKey = Name, unter dem das Spiel seinen Rekord in localStorage speichert (oder null).
const GAMES = [
  { num: '00', name: 'Ballwechsel', folder: '00-ballwechsel', color: '#ffffff', highscoreKey: null,
    desc: 'Zwei Schläger, ein Ball. Gegen die CPU oder zu zweit, bis 5 Punkte.' },
  { num: '01', name: 'Ziegelbrecher', folder: '01-ziegelbrecher', color: '#3498db', highscoreKey: 'ziegelbrecher-highscore',
    desc: 'Steine zerschießen in 5 Leveln, mit Power-ups und Multiball.' },
  { num: '02', name: 'Insekteninvasion', folder: '02-insekteninvasion', color: '#40ff40', highscoreKey: 'insekteninvasion-highscore',
    desc: 'Die Formation abwehren, hinter zerbröselnder Deckung. Mit Kakerlake.' },
  { num: '03', name: 'Weltraumsteine', folder: null, color: '#555', highscoreKey: null,
    desc: 'Kommt als Nächstes: Vektoren, Drehung und Trägheit.' },
];

// localStorage kann gesperrt sein – dann eben ohne Rekord-Anzeige
function readHighscore(key) {
  try {
    return Number(localStorage.getItem(key)) || 0;
  } catch (e) {
    return 0;
  }
}

const grid = document.getElementById('games');
for (const game of GAMES) {
  const card = document.createElement(game.folder ? 'a' : 'div');
  card.className = game.folder ? 'card' : 'card todo';
  if (game.folder) card.href = game.folder + '/index.html';
  card.style.setProperty('--accent', game.color);

  let html = `<span class="num">${game.num}</span>
    <span class="name">${game.name}</span>
    <span class="desc">${game.desc}</span>`;
  if (game.highscoreKey) html += `<span class="score">Rekord: <b>${readHighscore(game.highscoreKey)}</b></span>`;
  card.innerHTML = html;
  grid.appendChild(card);
}
</script>
</body>
</html>
