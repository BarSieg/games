<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weltraumsteine</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #111;
    color: #eee;
    font-family: "Courier New", monospace;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: min(800px, 96vw, 120vh);
    aspect-ratio: 4 / 3;
    background: #000;
    border: 2px solid #444;
    box-sizing: border-box;
  }
  .hint { margin-top: 12px; color: #888; font-size: 14px; text-align: center; padding: 0 16px; }
  .hint a { color: #888; }
</style>
</head>
<body>

<canvas id="game" width="800" height="600"></canvas>
<div class="hint">
  ← / → (A / D): drehen · ↑ (W): Schub · Leertaste: schießen · P: Pause · M: Ton an/aus · <a href="../index.html">alle Spiele</a>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ---------- Einstellungen ----------
const SHIP_R = 10, TURN_SPEED = 3.3, THRUST = 200, DRAG = 0.3, MAX_SPEED = 450;
const START_LIVES = 3, RESPAWN_TIME = 2, INVULN_TIME = 3, EXTRA_LIFE_EVERY = 10000;
const BULLET_SPEED = 520, BULLET_LIFE = 0.9, MAX_BULLETS = 5;
const START_ASTEROIDS = 4, MAX_ASTEROIDS = 11, SAFE_DISTANCE = 200, WAVE_DELAY = 2;
const BEAT_SLOW = 1.0, BEAT_FAST = 0.3, BEAT_SPEEDUP = 0.02;
const GREEN = '#40ff40', RED = '#ff4040', YELLOW = '#ffff00', WHITE = '#fff';
const FIREDELAY = 0.25;

// Die Asteroiden-Größen als Tabelle: Radius, Punkte und Tempo (von–bis in Pixel pro Sekunde)
const ASTEROID_SIZES = {
  3: { r: 44, points: 20,  speed: [30, 70], color: GREEN},     // groß
  2: { r: 22, points: 50,  speed: [60, 110], color: YELLOW },    // mittel
  1: { r: 11, points: 100, speed: [90, 150], color: RED },    // klein
};

// Das Schiff als Liste von Punkten. (0, 0) ist die Mitte, die Nase zeigt nach rechts (Winkel 0).
const SHIP_SHAPE = [
  { x: 16, y: 0 },
  { x: -10, y: -10 },
  { x: -6, y: 0 },
  { x: -10, y: 10 },
];

// ---------- Vektor-Helfer ----------
// Ein Vektor ist ein Pfeil mit einem x- und einem y-Anteil. Position, Geschwindigkeit
// und Schubkraft sind alles Vektoren. Achtung: Auf dem Bildschirm zeigt y nach UNTEN,
// darum ist „oben“ der Winkel -90° (-Math.PI / 2).

// Macht aus einem Winkel und einer Länge einen Vektor: cos liefert x, sin liefert y.
function fromAngle(angle, length) {
  return { x: Math.cos(angle) * length, y: Math.sin(angle) * length };
}

// Dreht einen Punkt um (0, 0). Das ist DIE Formel für Rotation – später in 3D genauso.
function rotate(p, angle) {
  const c = Math.cos(angle), s = Math.sin(angle);
  return { x: p.x * c - p.y * s, y: p.x * s + p.y * c };
}

// Abstand zwischen zwei Punkten (Satz des Pythagoras)
function distance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

// Wer links rausfliegt, kommt rechts wieder rein (und oben/unten genauso)
function wrap(obj) {
  obj.x = (obj.x + W) % W;
  obj.y = (obj.y + H) % H;
}

function randomBetween(min, max) {
  return min + Math.random() * (max - min);
}

// ---------- Spielzustand ----------
let state = 'title';   // title, play, paused, gameover
let score = 0, lives = START_LIVES, wave = 1, nextLifeAt = EXTRA_LIFE_EVERY;
let highscore = loadHighscore(), newRecord = false;
let ship = null, bullets = [], asteroids = [], particles = [], debris = [];
let respawnTimer = 0, waveDelay = 0, stateTimer = 0;
let beatTimer = 0, beatInterval = BEAT_SLOW, beatNote = 0;
let fireTimer = 0; //kann schiessen falls null

// ---------- Sound ----------
let audio = null, muted = false, thrustGain = null, thrustOn = false;
function ensureAudio() {
  if (!audio) {
    audio = new (window.AudioContext || window.webkitAudioContext)();
    startThrustSound();
  }
  if (audio.state === 'suspended') audio.resume();
}
function beep(freq, dur, type = 'square', vol = 0.06, slideTo = null) {
  if (!audio || muted) return;
  const t = audio.currentTime;
  const osc = audio.createOscillator(), gain = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(gain).connect(audio.destination);
  osc.start(t);
  osc.stop(t + dur);
}
function noiseBuffer(dur) {
  const buffer = audio.createBuffer(1, Math.floor(audio.sampleRate * dur), audio.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  return buffer;
}
function noise(dur, vol = 0.12) {
  if (!audio || muted) return;
  const t = audio.currentTime;
  const src = audio.createBufferSource(), gain = audio.createGain();
  src.buffer = noiseBuffer(dur);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(gain).connect(audio.destination);
  src.start(t);
}
// Das Triebwerk ist ein Dauer-Rauschen, das wir nur lauter und leiser drehen.
// Ein Tiefpass-Filter nimmt die hellen Töne weg, dann klingt es nach Rumpeln statt Zischen.
function startThrustSound() {
  const src = audio.createBufferSource(), filter = audio.createBiquadFilter();
  thrustGain = audio.createGain();
  src.buffer = noiseBuffer(1);
  src.loop = true;
  filter.type = 'lowpass';
  filter.frequency.value = 500;
  thrustGain.gain.value = 0;
  src.connect(filter).connect(thrustGain).connect(audio.destination);
  src.start();
}
function setThrustSound(on) {
  on = on && !muted;
  if (!thrustGain || on === thrustOn) return;
  thrustOn = on;
  thrustGain.gain.setTargetAtTime(on ? 0.12 : 0, audio.currentTime, 0.03);
}
const sfx = {
  shoot: () => beep(1400, 0.1, 'triangle', 0.06, 300),
  bang:  size => noise(0.15 + size * 0.15, 0.05 + size * 0.04),
  beat:  n => beep(n === 0 ? 62 : 55, 0.12, 'square', 0.14),
  death: () => noise(1.2, 0.2),
  extra: () => beep(880, 0.4, 'square', 0.05, 1760),
};

// ---------- Highscore ----------
// localStorage kann gesperrt sein, darum try/catch (wie in Ziegelbrecher und Insekteninvasion).
function loadHighscore() {
  try {
    return Number(localStorage.getItem('weltraumsteine-highscore')) || 0;
  } catch (e) {
    return 0;
  }
}
function saveHighscore() {
  if (score <= highscore) return;
  highscore = score;
  try {
    localStorage.setItem('weltraumsteine-highscore', highscore);
  } catch (e) { /* dann eben ohne Speichern */ }
}

// ---------- Spielablauf ----------
function newGame() {
  score = 0;
  lives = START_LIVES;
  wave = 1;
  nextLifeAt = EXTRA_LIFE_EVERY;
  newRecord = false;
  bullets = [];
  particles = [];
  debris = [];
  waveDelay = 0;
  spawnShip();
  spawnWave();
  fireTimer = 0;
  state = 'play';
}

function spawnShip() {
  ship = { x: W / 2, y: H / 2, vx: 0, vy: 0, angle: -Math.PI / 2, alive: true, invuln: INVULN_TIME };
}

function spawnWave() {
  asteroids = [];
  const count = Math.min(START_ASTEROIDS + wave - 1, MAX_ASTEROIDS);
  for (let i = 0; i < count; i++) {
    // neue Asteroiden nie direkt auf dem Schiff erscheinen lassen
    let pos;
    do {
      pos = { x: Math.random() * W, y: Math.random() * H };
    } while (ship && distance(pos, ship) < SAFE_DISTANCE);
    asteroids.push(makeAsteroid(pos.x, pos.y, 3));
  }
  beatInterval = BEAT_SLOW;
  beatTimer = BEAT_SLOW;
}

// Pro Welle werden die Asteroiden 10 % schneller
function difficulty() {
  return 1 + (wave - 1) * 0.1;
}

function gameOver() {
  state = 'gameover';
  stateTimer = 1;
  newRecord = score > highscore;
  saveHighscore();
  setThrustSound(false);
}

function addScore(points) {
  score += points;
  if (score >= nextLifeAt) {
    lives++;
    nextLifeAt += EXTRA_LIFE_EVERY;
    sfx.extra();
  }
}

// Leertaste: macht je nach Zustand etwas anderes
function action() {
  if (state === 'title') newGame();
  else if (state === 'gameover' && stateTimer <= 0) newGame();
  else if (state === 'play') fire();
}

function togglePause() {
  if (state === 'play') { state = 'paused'; setThrustSound(false); }
  else if (state === 'paused') state = 'play';
}

// ---------- Schiff ----------
function updateShip(dt) {
  if (!ship.alive) {
    respawnTimer -= dt;
    if (respawnTimer <= 0) {
      if (lives > 0) spawnShip();
      else gameOver();
    }
    return;
  }

  let turn = 0;
  if (keys.ArrowLeft || keys.KeyA) turn -= 1;
  if (keys.ArrowRight || keys.KeyD) turn += 1;
  ship.angle += turn * TURN_SPEED * dt;
  
  fireTimer -= dt;
  if (fireTimer <= 0 && keys.Space) fire(); 

  // Schub: ein kleiner Vektor in Blickrichtung wird zur Geschwindigkeit addiert.
  // Die Geschwindigkeit bleibt danach erhalten – das ist Trägheit.
  ship.thrusting = keys.ArrowUp || keys.KeyW;
  if (ship.thrusting) {
    const push = fromAngle(ship.angle, THRUST * dt);
    ship.vx += push.x;
    ship.vy += push.y;
  }

  // Reibung: Jede Sekunde geht ein fester Anteil der Geschwindigkeit verloren
  const drag = Math.exp(-DRAG * dt);
  ship.vx *= drag;
  ship.vy *= drag;

  // Höchstgeschwindigkeit: den Vektor auf MAX_SPEED kürzen, Richtung bleibt gleich
  const speed = Math.hypot(ship.vx, ship.vy);
  if (speed > MAX_SPEED) {
    ship.vx *= MAX_SPEED / speed;
    ship.vy *= MAX_SPEED / speed;
  }

  ship.x += ship.vx * dt;
  ship.y += ship.vy * dt;
  wrap(ship);
  if (ship.invuln > 0) ship.invuln -= dt;
  setThrustSound(ship.thrusting);
}

function fire() {
  if (!ship.alive || bullets.length >= MAX_BULLETS) return;
  const nose = rotate(SHIP_SHAPE[0], ship.angle);
  const v = fromAngle(ship.angle, BULLET_SPEED);
  // Die Kugel bekommt die Geschwindigkeit des Schiffs dazu (Vektoren addieren)
  bullets.push({
    x: ship.x + nose.x, y: ship.y + nose.y,
    vx: ship.vx + v.x, vy: ship.vy + v.y,
    t: BULLET_LIFE,
  });
  fireTimer = FIREDELAY;
  sfx.shoot();
}

function hyperJump() {
  ship.x = Math.floor(Math.random() * W);
  ship.y = Math.floor(Math.random() * H);
  if (Math.random() < 0.16) explodeShip();
}

// Das Schiff zerfällt in seine einzelnen Linien, die davontrudeln
function explodeShip() {
  ship.alive = false;
  lives--;
  respawnTimer = RESPAWN_TIME;
  setThrustSound(false);
  sfx.death();

  const pts = SHIP_SHAPE.map(p => rotate(p, ship.angle));
  pts.forEach((a, i) => {
    const b = pts[(i + 1) % pts.length];
    const v = fromAngle(Math.random() * Math.PI * 2, randomBetween(20, 60));
    debris.push({
      x: ship.x + (a.x + b.x) / 2, y: ship.y + (a.y + b.y) / 2,
      vx: ship.vx * 0.3 + v.x, vy: ship.vy * 0.3 + v.y,
      half: { x: (b.x - a.x) / 2, y: (b.y - a.y) / 2 },
      angle: 0, spin: randomBetween(-3, 3), t: 2,
    });
  });
  burst(ship.x, ship.y, 20);
}

// ---------- Asteroiden ----------
function makeAsteroid(x, y, size) {
  const type = ASTEROID_SIZES[size];
  const v = fromAngle(Math.random() * Math.PI * 2, randomBetween(...type.speed) * difficulty());

  // Zufällige, zackige Form: Punkte rund um einen Kreis, jeder mit etwas anderem Abstand
  const points = [];
  const corners = 10 + Math.floor(Math.random() * 4);
  for (let i = 0; i < corners; i++) {
    const p = fromAngle(i / corners * Math.PI * 2, type.r * randomBetween(0.7, 1.1));
    points.push(p);
  }
  return { x, y, vx: v.x, vy: v.y, size, r: type.r, angle: 0, spin: randomBetween(-1, 1), points };
}

function updateAsteroids(dt) {
  for (const a of asteroids) {
    a.x += a.vx * dt;
    a.y += a.vy * dt;
    a.angle += a.spin * dt;
    wrap(a);
  }
}

// Ein großer Asteroid zerfällt in zwei mittlere, ein mittlerer in zwei kleine
function destroyAsteroid(a) {
  a.dead = true;
  addScore(ASTEROID_SIZES[a.size].points);
  if (a.size > 1) {
    asteroids.push(makeAsteroid(a.x, a.y, a.size - 1));
    asteroids.push(makeAsteroid(a.x, a.y, a.size - 1));
  }
  burst(a.x, a.y, a.size * 6);
  sfx.bang(a.size);
}

// Treffer-Radius etwas kleiner als der Umriss, weil die Form zackig ist
function hitRadius(a) {
  return a.r * 0.85;
}

// ---------- Kugeln ----------
function stepBullets(h) {
  for (const b of bullets) {
    b.x += b.vx * h;
    b.y += b.vy * h;
    wrap(b);
    b.t -= h;
    for (const a of asteroids) {
      if (!a.dead && distance(b, a) < hitRadius(a)) {
        destroyAsteroid(a);
        b.t = 0;
        break;
      }
    }
  }
  bullets = bullets.filter(b => b.t > 0);
  asteroids = asteroids.filter(a => !a.dead);
}

// ---------- Partikel ----------
function burst(x, y, count) {
  for (let i = 0; i < count; i++) {
    const v = fromAngle(Math.random() * Math.PI * 2, randomBetween(30, 160));
    particles.push({ x, y, vx: v.x, vy: v.y, t: randomBetween(0.4, 1) });
  }
}

function updateEffects(dt) {
  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.t -= dt;
  }
  particles = particles.filter(p => p.t > 0);
  for (const d of debris) {
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    d.angle += d.spin * dt;
    d.t -= dt;
  }
  debris = debris.filter(d => d.t > 0);
}

// ---------- Hauptschleife ----------
function update(dt) {
  if (state === 'paused') return;

  // Asteroiden und Effekte fliegen immer – auch im Titelbild als Hintergrund
  updateAsteroids(dt);
  updateEffects(dt);

  if (state === 'gameover') stateTimer -= dt;
  if (state !== 'play') return;

  updateShip(dt);
  if (state !== 'play') return;   // updateShip kann das Spiel beenden

  // kleine Teilschritte, damit schnelle Kugeln nicht durch kleine Asteroiden „tunneln“
  let t = dt;
  while (t > 0) {
    const h = Math.min(t, 1 / 120);
    stepBullets(h);
    t -= h;
  }

  // Schiff gegen Asteroid: Kreis gegen Kreis – berühren sie sich, wenn der Abstand
  // der Mittelpunkte kleiner ist als beide Radien zusammen?
  if (ship.alive && ship.invuln <= 0) {
    const hit = asteroids.find(a => distance(ship, a) < hitRadius(a) + SHIP_R);
    if (hit) {
      destroyAsteroid(hit);
      asteroids = asteroids.filter(a => !a.dead);
      explodeShip();
    }
  }

  // Welle geschafft? Kurz durchatmen, dann kommt die nächste
  if (asteroids.length === 0 && waveDelay === 0) waveDelay = WAVE_DELAY;
  if (waveDelay > 0) {
    waveDelay -= dt;
    if (waveDelay <= 0) {
      waveDelay = 0;
      wave++;
      spawnWave();
    }
  }

  // Herzschlag-Sound: wird mit der Zeit immer schneller
  if (asteroids.length > 0) {
    beatTimer -= dt;
    if (beatTimer <= 0) {
      sfx.beat(beatNote);
      beatNote = 1 - beatNote;
      beatInterval = Math.max(BEAT_FAST, beatInterval - BEAT_SPEEDUP);
      beatTimer = beatInterval;
    }
  }
}

// Zeichnet eine Form aus Punkten, gedreht um angle und verschoben nach (x, y)
function drawShape(points, x, y, angle, closed = true) {
  ctx.beginPath();
  points.forEach((p, i) => {
    const r = rotate(p, angle);
    if (i === 0) ctx.moveTo(x + r.x, y + r.y);
    else ctx.lineTo(x + r.x, y + r.y);
  });
  if (closed) ctx.closePath();
  ctx.stroke();
}

// Steht ein Objekt halb über dem Rand, wird es zusätzlich auf der anderen Seite gezeichnet
function drawWrapped(obj, r, drawAt) {
  for (const ox of [-W, 0, W]) {
    for (const oy of [-H, 0, H]) {
      const x = obj.x + ox, y = obj.y + oy;
      if (x + r < 0 || x - r > W || y + r < 0 || y - r > H) continue;
      drawAt(x, y);
    }
  }
}

function drawShip(x, y) {
  drawShape(SHIP_SHAPE, x, y, ship.angle);
  // Flamme flackert: die Spitze ist jedes Bild etwas anders lang
  if (ship.thrusting && Math.random() < 0.8) {
    const flame = [{ x: -7, y: -5 }, { x: -14 - Math.random() * 8, y: 0 }, { x: -7, y: 5 }];
    drawShape(flame, x, y, ship.angle, false);
  }
}

function drawText(text, x, y, size, color = '#fff', align = 'center') {
  ctx.fillStyle = color;
  ctx.font = `bold ${size}px "Courier New", monospace`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
}

function blinkOn(perSecond = 2) {
  return Math.floor(performance.now() / 1000 * perSecond) % 2 === 0;
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  // leichtes Leuchten wie auf einem alten Vektor-Bildschirm
  ctx.shadowColor = '#fff';
  ctx.shadowBlur = 6;
  ctx.strokeStyle = WHITE;
  ctx.lineWidth = 1.5;
  ctx.lineJoin = 'round';

  for (const a of asteroids) {
    ctx.strokeStyle = ASTEROID_SIZES[a.size].color;
    drawWrapped(a, a.r * 1.1, (x, y) => drawShape(a.points, x, y, a.angle));
  }
  ctx.strokeStyle = WHITE;

  for (const p of particles) {
    ctx.fillStyle = `rgba(255, 255, 255, ${Math.min(1, p.t * 2)})`;
    ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
  }
  for (const d of debris) {
    const e = rotate(d.half, d.angle);
    ctx.globalAlpha = Math.min(1, d.t);
    ctx.beginPath();
    ctx.moveTo(d.x - e.x, d.y - e.y);
    ctx.lineTo(d.x + e.x, d.y + e.y);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  if (state !== 'title') {
    // Schiff: blinkt, solange es unverwundbar ist
    if (ship.alive && (ship.invuln <= 0 || blinkOn(8))) drawWrapped(ship, 20, drawShip);

    ctx.fillStyle = '#fff';
    for (const b of bullets) ctx.fillRect(b.x - 1.5, b.y - 1.5, 3, 3);

    // HUD
    drawText(String(score), 24, 28, 26, '#fff', 'left');
    for (let i = 0; i < lives; i++) drawShape(SHIP_SHAPE, 34 + i * 24, 66, -Math.PI / 2);
    drawText('WELLE ' + wave, W - 24, 28, 18, '#fff', 'right');
  }
  drawText('REKORD ' + highscore, W / 2, 28, 18, '#aaa');

  ctx.shadowBlur = 0;

  // Meldungen je nach Zustand
  if (state === 'title') {
    drawText('WELTRAUMSTEINE', W / 2, 220, 72);
    drawText('GROSS 20  ·  MITTEL 50  ·  KLEIN 100 PUNKTE', W / 2, 300, 18, '#aaa');
    if (blinkOn()) drawText('LEERTASTE ZUM STARTEN', W / 2, 380, 24);
  }
  if (state === 'play' && waveDelay > 0) drawText('WELLE ' + wave + ' GESCHAFFT!', W / 2, H / 2, 32);
  if (state === 'paused') {
    drawText('PAUSE', W / 2, H / 2 - 20, 48);
    drawText('P: WEITER', W / 2, H / 2 + 30, 20, '#aaa');
  }
  if (state === 'gameover') {
    drawText('GAME OVER', W / 2, H / 2 - 40, 56);
    drawText('PUNKTE ' + score, W / 2, H / 2 + 15, 24);
    if (newRecord) drawText('NEUER REKORD!', W / 2, H / 2 + 50, 22);
    if (stateTimer <= 0) drawText('LEERTASTE: NOCHMAL', W / 2, H / 2 + 90, 20, '#aaa');
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// Im Titelbild treiben schon ein paar Asteroiden durchs Bild
spawnWave();
requestAnimationFrame(loop);

// ---------- Eingaben ----------
const keys = {};
addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  ensureAudio();
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'Enter') action();
  if (e.code === 'KeyP') togglePause();
  if (e.code === 'KeyH') hyperJump();
  if (e.code === 'KeyM') { muted = !muted; setThrustSound(false); }
  // Entwickler-Abkürzung zum Testen: K zerstört alle Asteroiden
  if (e.code === 'KeyK' && state === 'play') asteroids.forEach(a => a.dead = true);
});
addEventListener('keyup', e => { keys[e.code] = false; });
</script>
</body>
</html>
